[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-invoice-agents"
version = "0.1.0"
description = "A safe, auditable LangGraph invoice-processing prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6",
  "openai>=1.60",
  "pdfplumber>=0.11",
  "pydantic>=2.10",
  "python-dateutil>=2.9",
  "streamlit>=1.49",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
acme-invoices = "acme_invoice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
